; Notes:
; priority=1 --> Lower priorities indicate programs that start first and shut down last
; killasgroup=true --> send kill signal to child processes too

; graceful timeout should always be lower than stopwaitsecs to avoid orphan gunicorn workers.
[program:frappe-bench-b-frappe-web]
command=/home/frappe/frappe-bench-b/env/bin/gunicorn -b 127.0.0.1:8002 -w 5 --max-requests 5000 --max-requests-jitter 500 -t 120 --graceful-timeout 30 frappe.app:application --preload
priority=4
autostart=true
autorestart=true
stdout_logfile=/home/frappe/frappe-bench-b/logs/web.log
stderr_logfile=/home/frappe/frappe-bench-b/logs/web.error.log
stopwaitsecs=40
killasgroup=true
user=frappe
directory=/home/frappe/frappe-bench-b/sites
startretries=10

[program:frappe-bench-b-frappe-schedule]
command=/home/frappe/.local/bin/bench schedule
priority=3
autostart=true
stdout_logfile=/home/frappe/frappe-bench-b/logs/schedule.log
stderr_logfile=/home/frappe/frappe-bench-b/logs/schedule.error.log
user=frappe
directory=/home/frappe/frappe-bench-b
startretries=10



[program:frappe-bench-b-frappe-short-worker]
command=/home/frappe/.local/bin/bench worker --queue short,default
priority=4
autostart=true
autorestart=true
stdout_logfile=/home/frappe/frappe-bench-b/logs/worker.log
stderr_logfile=/home/frappe/frappe-bench-b/logs/worker.error.log
user=frappe
stopwaitsecs=360
directory=/home/frappe/frappe-bench-b
killasgroup=true
numprocs=1
process_name=%(program_name)s-%(process_num)d
startretries=10

[program:frappe-bench-b-frappe-long-worker]
command=/home/frappe/.local/bin/bench worker --queue long,default,short
priority=4
autostart=true
autorestart=true
stdout_logfile=/home/frappe/frappe-bench-b/logs/worker.log
stderr_logfile=/home/frappe/frappe-bench-b/logs/worker.error.log
user=frappe
stopwaitsecs=1560
directory=/home/frappe/frappe-bench-b
killasgroup=true
numprocs=1
process_name=%(program_name)s-%(process_num)d
startretries=10





[program:frappe-bench-b-redis-cache]
command=/usr/bin/redis-server /home/frappe/frappe-bench-b/config/redis_cache.conf
priority=1
autostart=true
autorestart=true
stdout_logfile=/home/frappe/frappe-bench-b/logs/redis-cache.log
stderr_logfile=/home/frappe/frappe-bench-b/logs/redis-cache.error.log
user=frappe
directory=/home/frappe/frappe-bench-b/sites
startretries=10

[program:frappe-bench-b-redis-queue]
command=/usr/bin/redis-server /home/frappe/frappe-bench-b/config/redis_queue.conf
priority=1
autostart=true
autorestart=true
stdout_logfile=/home/frappe/frappe-bench-b/logs/redis-queue.log
stderr_logfile=/home/frappe/frappe-bench-b/logs/redis-queue.error.log
user=frappe
directory=/home/frappe/frappe-bench-b/sites
startretries=10



[program:frappe-bench-b-node-socketio]
command=/home/frappe/.local/bin/bench socketio
priority=4
autostart=true
autorestart=true
stdout_logfile=/home/frappe/frappe-bench-b/logs/node-socketio.log
stderr_logfile=/home/frappe/frappe-bench-b/logs/node-socketio.error.log
user=frappe
directory=/home/frappe/frappe-bench-b
startretries=10


[group:frappe-bench-b-web]
programs=frappe-bench-b-frappe-web,frappe-bench-b-node-socketio




[group:frappe-bench-b-workers]
programs=frappe-bench-b-frappe-schedule,frappe-bench-b-frappe-short-worker,frappe-bench-b-frappe-long-worker




[group:frappe-bench-b-redis]
programs=frappe-bench-b-redis-cache,frappe-bench-b-redis-queue
