# Serves instance A (site 187.127.123.235) over plain IP:port on 8001.
#
# Defines its own upstreams on purpose. An earlier version reused the
# sheikh_erp_* names from sheikhmahboob-erp.conf; when that file was repointed
# at instance B during the cutover, port 8001 silently started proxying to
# instance B, which has no site named 187.127.123.235 and answered 404.
#
# Deploy to: /etc/nginx/conf.d/sheikhmahboob-erp-ip.conf

upstream sheikh_erp_a_frappe {
    server 127.0.0.1:8000 fail_timeout=0;
}
upstream sheikh_erp_a_socketio {
    server 127.0.0.1:9000 fail_timeout=0;
}

server {
    listen 8001;
    listen [::]:8001;
    server_name 187.127.123.235 _;

    root /home/frappe/frappe-bench/sites;

    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    client_max_body_size 50m;

    location /assets {
        try_files $uri =404;
        add_header Cache-Control "max-age=31536000";
    }

    location ~ ^/protected/(.*) {
        internal;
        try_files /187.127.123.235/$1 =404;
    }

    location /socket.io {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Frappe-Site-Name 187.127.123.235;
        proxy_set_header Origin $scheme://$http_host;
        proxy_set_header Host $host;
        proxy_pass http://sheikh_erp_a_socketio;
    }

    location / {
        rewrite ^(.+)/$ $1 permanent;
        rewrite ^(.+)/index\.html$ $1 permanent;
        rewrite ^(.+)\.html$ $1 permanent;

        location ~* ^/files/.*.(htm|html|svg|xml) {
            add_header Content-disposition "attachment";
            try_files /187.127.123.235/public/$uri @sheikh_ip_webserver;
        }

        try_files /187.127.123.235/public/$uri @sheikh_ip_webserver;
    }

    location @sheikh_ip_webserver {
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name 187.127.123.235;
        proxy_set_header Host $host;
        proxy_set_header X-Use-X-Accel-Redirect True;
        proxy_read_timeout 120;
        proxy_redirect off;
        proxy_pass http://sheikh_erp_a_frappe;
    }

    access_log /var/log/nginx/sheikhmahboob-ip.access.log;
    error_log  /var/log/nginx/sheikhmahboob-ip.error.log;
}
