# sheikhmahboob.com -> instance B (bench /home/frappe/frappe-bench-b, site sheikhmahboob.com)
#
# Replaces /etc/nginx/conf.d/sheikhmahboob-erp.conf at cutover (Step 5).
# Back the current file up first:
#   cp /etc/nginx/conf.d/sheikhmahboob-erp.conf /root/sheikhmahboob-erp.conf.pre-split-$(date +%Y%m%d%H%M%S)
#
# The Certbot lines are unchanged: the existing certificate already covers
# sheikhmahboob.com and www.sheikhmahboob.com and stays valid across the switch.

upstream sheikh_erp_frappe {
    server 127.0.0.1:8002 fail_timeout=0;
}
upstream sheikh_erp_socketio {
    server 127.0.0.1:9002 fail_timeout=0;
}

server {
    server_name sheikhmahboob.com www.sheikhmahboob.com;

    root /home/frappe/frappe-bench-b/sites;

    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    client_max_body_size 50m;

    location /assets {
        try_files $uri =404;
        add_header Cache-Control "max-age=31536000";
    }

    location ~ ^/protected/(.*) {
        internal;
        try_files /sheikhmahboob.com/$1 =404;
    }

    location /socket.io {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Frappe-Site-Name sheikhmahboob.com;
        proxy_set_header Origin $scheme://$http_host;
        proxy_set_header Host $host;
        proxy_pass http://sheikh_erp_socketio;
    }

    location / {
        rewrite ^(.+)/$ $1 permanent;
        rewrite ^(.+)/index\.html$ $1 permanent;
        rewrite ^(.+)\.html$ $1 permanent;

        location ~* ^/files/.*.(htm|html|svg|xml) {
            add_header Content-disposition "attachment";
            try_files /sheikhmahboob.com/public/$uri @sheikh_webserver;
        }

        try_files /sheikhmahboob.com/public/$uri @sheikh_webserver;
    }

    location @sheikh_webserver {
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name sheikhmahboob.com;
        proxy_set_header Host $host;
        proxy_set_header X-Use-X-Accel-Redirect True;
        proxy_read_timeout 120;
        proxy_redirect off;
        proxy_pass http://sheikh_erp_frappe;
    }

    access_log /var/log/nginx/sheikhmahboob.access.log;
    error_log  /var/log/nginx/sheikhmahboob.error.log;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sheikhmahboob.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sheikhmahboob.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.sheikhmahboob.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = sheikhmahboob.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name sheikhmahboob.com www.sheikhmahboob.com;
    return 404; # managed by Certbot
}
