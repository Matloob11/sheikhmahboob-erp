# sheikhmahboob.com on VPS srv1992968 (187.53.143.235).
#
# Frappe/ERPNext + di entry: /di/login.php
# Daftar (PRA desk, static): /pra/
# Perk PHP ERP deliberately NOT deployed on this server.

# 120 requests a minute per client IP is far above one desk posting invoices one by one.
limit_req_zone $binary_remote_addr zone=praims:10m rate=120r/m;

upstream smc_frappe {
    server 127.0.0.1:8000 fail_timeout=0;
}
upstream smc_socketio {
    server 127.0.0.1:9000 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name sheikhmahboob.com www.sheikhmahboob.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sheikhmahboob.com www.sheikhmahboob.com;

    ssl_certificate /etc/letsencrypt/live/sheikhmahboob.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sheikhmahboob.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /home/frappe/frappe-bench/sites;

    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    client_max_body_size 50m;

    # Homepage used to be the marketing landing page. Send visitors to DI login.
    location = / {
        return 302 /di/login.php;
    }

    location = /di {
        return 302 /di/login.php;
    }

    location = /di/ {
        return 302 /di/login.php;
    }

    # Digital Invoice login URL — serve Frappe /login while keeping this path.
    location = /di/login.php {
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name sheikhmahboob.com;
        proxy_set_header Host $host;
        proxy_set_header X-Use-X-Accel-Redirect True;
        proxy_read_timeout 120;
        proxy_redirect off;
        proxy_pass http://smc_frappe/login;
    }

    # PRA eIMS PostData — same-origin proxy. PRA sees this VPS public IP, which is the
    # whitelisted one, so this must never be an open relay:
    #   * only the two documented PostData paths (exact match beats the ^~ catch-all below),
    #     everything else under /pra-ims is 404
    #   * GET (health probe, PRA answers 405) and POST only
    #   * POST must come from this site (Origin), so other sites' pages cannot drive it
    #   * per-IP rate limit and a small body cap
    location = /pra-ims/ims/sandbox/api/Live/PostData {
        limit_except GET POST { deny all; }
        limit_req zone=praims burst=40 nodelay;
        limit_req_status 429;
        client_max_body_size 256k;

        set $pra_gate "";
        if ($request_method = POST) { set $pra_gate "P"; }
        if ($http_origin !~* "^https://(www\.)?sheikhmahboob\.com$") { set $pra_gate "${pra_gate}X"; }
        if ($pra_gate = "PX") { return 403; }

        # Literal upstream URL: a variable here would need a runtime resolver.
        proxy_pass https://ims.pral.com.pk/ims/sandbox/api/Live/PostData;
        proxy_http_version 1.1;
        proxy_bind 187.53.143.235;
        proxy_ssl_server_name on;
        proxy_ssl_name ims.pral.com.pk;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_ciphers HIGH:!aNULL:!MD5;
        proxy_ssl_session_reuse off;
        proxy_ssl_verify off;
        proxy_set_header Host ims.pral.com.pk;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Connection "";
        # The ERP session cookie lives on this origin; PRA must never receive it.
        proxy_set_header Cookie "";
        proxy_connect_timeout 20s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_intercept_errors off;
        add_header Cache-Control "no-store" always;
    }

    location = /pra-ims/ims/production/api/Live/PostData {
        limit_except GET POST { deny all; }
        limit_req zone=praims burst=40 nodelay;
        limit_req_status 429;
        client_max_body_size 256k;

        set $pra_gate "";
        if ($request_method = POST) { set $pra_gate "P"; }
        if ($http_origin !~* "^https://(www\.)?sheikhmahboob\.com$") { set $pra_gate "${pra_gate}X"; }
        if ($pra_gate = "PX") { return 403; }

        # Literal upstream URL: a variable here would need a runtime resolver.
        proxy_pass https://ims.pral.com.pk/ims/production/api/Live/PostData;
        proxy_http_version 1.1;
        proxy_bind 187.53.143.235;
        proxy_ssl_server_name on;
        proxy_ssl_name ims.pral.com.pk;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_ciphers HIGH:!aNULL:!MD5;
        proxy_ssl_session_reuse off;
        proxy_ssl_verify off;
        proxy_set_header Host ims.pral.com.pk;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Connection "";
        # The ERP session cookie lives on this origin; PRA must never receive it.
        proxy_set_header Cookie "";
        proxy_connect_timeout 20s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_intercept_errors off;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /pra-ims {
        return 404;
    }

    # PRA eIMS desk (static Vite SPA). Do not proxy to Frappe.
    location = /pra {
        return 301 /pra/;
    }

    location ^~ /pra/assets/ {
        root /var/www/pra-site;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /pra {
        root /var/www/pra-site;
        try_files $uri $uri/ /pra/index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    location /assets {
        try_files $uri =404;
        add_header Cache-Control "max-age=31536000";
    }

    location ~ ^/protected/(.*) {
        internal;
        try_files /sheikhmahboob.com/$1 =404;
    }

    location /socket.io {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Frappe-Site-Name sheikhmahboob.com;
        proxy_set_header Origin $scheme://$http_host;
        proxy_set_header Host $host;
        proxy_pass http://smc_socketio;
    }

    location / {
        rewrite ^(.+)/$ $1 permanent;
        rewrite ^(.+)/index\.html$ $1 permanent;
        rewrite ^(.+)\.html$ $1 permanent;

        location ~* ^/files/.*.(htm|html|svg|xml) {
            add_header Content-disposition "attachment";
            try_files /sheikhmahboob.com/public/$uri @webserver;
        }

        try_files /sheikhmahboob.com/public/$uri @webserver;
    }

    location @webserver {
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name sheikhmahboob.com;
        proxy_set_header Host $host;
        proxy_set_header X-Use-X-Accel-Redirect True;
        proxy_read_timeout 120;
        proxy_redirect off;
        proxy_pass http://smc_frappe;
    }

    access_log /var/log/nginx/sheikhmahboob.access.log;
    error_log  /var/log/nginx/sheikhmahboob.error.log;
}
