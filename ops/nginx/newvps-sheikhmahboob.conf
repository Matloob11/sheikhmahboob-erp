# sheikhmahboob.com on the new VPS (187.52.120.196).
#
# This box hosts one instance, so it uses bench's default ports rather than the
# 8002/9002 offsets the old shared box needed.
#
# Deploy to: /etc/nginx/conf.d/sheikhmahboob.conf
#
# The certificate is carried over from the old server before the DNS change, so
# HTTPS keeps working from the moment the domain moves rather than breaking
# until certbot can run.

upstream smc_frappe {
    server 127.0.0.1:8000 fail_timeout=0;
}
upstream smc_socketio {
    server 127.0.0.1:9000 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name sheikhmahboob.com www.sheikhmahboob.com;

    # Certbot's HTTP-01 challenge must be reachable for renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sheikhmahboob.com www.sheikhmahboob.com;

    ssl_certificate /etc/letsencrypt/live/sheikhmahboob.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sheikhmahboob.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /home/frappe/frappe-bench/sites;

    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    client_max_body_size 50m;

    location /assets {
        try_files $uri =404;
        add_header Cache-Control "max-age=31536000";
    }

    location ~ ^/protected/(.*) {
        internal;
        try_files /sheikhmahboob.com/$1 =404;
    }

    location /socket.io {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Frappe-Site-Name sheikhmahboob.com;
        proxy_set_header Origin $scheme://$http_host;
        proxy_set_header Host $host;
        proxy_pass http://smc_socketio;
    }

    location / {
        rewrite ^(.+)/$ $1 permanent;
        rewrite ^(.+)/index\.html$ $1 permanent;
        rewrite ^(.+)\.html$ $1 permanent;

        location ~* ^/files/.*.(htm|html|svg|xml) {
            add_header Content-disposition "attachment";
            try_files /sheikhmahboob.com/public/$uri @webserver;
        }

        try_files /sheikhmahboob.com/public/$uri @webserver;
    }

    location @webserver {
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name sheikhmahboob.com;
        proxy_set_header Host $host;
        proxy_set_header X-Use-X-Accel-Redirect True;
        proxy_read_timeout 120;
        proxy_redirect off;
        proxy_pass http://smc_frappe;
    }

    access_log /var/log/nginx/sheikhmahboob.access.log;
    error_log  /var/log/nginx/sheikhmahboob.error.log;
}
