# Daftar Postgres on VPS — loopback only, memory capped.
services:
  postgres:
    image: postgres:16-alpine
    container_name: daftar-pg
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: daftar
      POSTGRES_PASSWORD: ${DAFTAR_PG_PASSWORD}
      POSTGRES_DB: daftar
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - daftar_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daftar -d daftar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  daftar_pg_data:
