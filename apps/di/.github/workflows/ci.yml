name: CI

on:
  push:
    branches:
      - develop
      - version-16
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: Server

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Find tests
        run: |
          echo "Finding tests"
          grep -rn "def test" > /dev/null

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 18
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v5
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB Client
        run: |
          sudo apt-get update
          sudo apt-get install --yes mariadb-client

      - name: Setup
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" --frappe-branch version-16 ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app erpnext --branch version-16
          bench get-app di $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext
          bench --site test_site install-app di
          bench build
        env:
          CI: "Yes"

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app di
        env:
          TYPE: server

  site-less:
    # Site-less runner used locally via ops/run-tests-wsl.sh. Kept alongside the
    # bench job because REVIEW.md deliberately does not rely on bench run-tests.
    runs-on: ubuntu-latest
    name: Site-less suite
    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Setup Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Clone Frappe version-16
        run: git clone --depth 1 --branch version-16 https://github.com/frappe/frappe.git "$HOME/frappe"

      - name: Install Frappe (skip mysqlclient) and run di/tests/run.py
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          deps = tomllib.load(open(Path.home() / "frappe" / "pyproject.toml", "rb"))["project"]["dependencies"]
          Path("/tmp/frappe-req.txt").write_text(
              "\n".join(d for d in deps if not d.lower().startswith("mysqlclient")) + "\n"
          )
          PY
          pip install -r /tmp/frappe-req.txt
          pip install --no-deps -e "$HOME/frappe"
          mkdir -p "$HOME/di-bench/sites" "$HOME/di-bench/logs" "$HOME/di-bench/apps"
          ln -sfn "$GITHUB_WORKSPACE" "$HOME/di-bench/apps/di"
          ln -sfn "$HOME/frappe" "$HOME/di-bench/apps/frappe"
          printf 'frappe\ndi\n' >"$HOME/di-bench/sites/apps.txt"
          echo '{}' >"$HOME/di-bench/sites/common_site_config.json"
          export PYTHONPATH="$GITHUB_WORKSPACE"
          cd "$HOME/di-bench/sites"
          python "$GITHUB_WORKSPACE/di/tests/run.py"
